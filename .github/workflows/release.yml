name: Publish Docker release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}@${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and publish release image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release


  smoke-test:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker-smoke.yml
    with:
      image: ${{ needs.publish.outputs.image }}
